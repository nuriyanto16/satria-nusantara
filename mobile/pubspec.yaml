name: satria_nusantara_mobile
description: Aplikasi Mobile Satria Nusantara untuk Anggota dan Pelatih.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.3.3
  flutter_bloc: ^8.1.3
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
  http: ^1.2.0
  url_launcher: ^6.2.5
  app_links: ^7.2.1
  qr_flutter: ^4.1.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
