<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Mobile Satria Nusantara untuk Anggota dan Pelatih.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="satria_nusantara_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Identity Services (GIS) API & OAuth 2.0 Popup Handler for Google SSO -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.GOOGLE_CLIENT_ID = ''; // Set your Google Cloud OAuth Client ID here

    window.onFlutterGoogleSuccess = function(jsonStr) {
      try {
        var payload = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
        if (payload.email) {
          localStorage.setItem('sn_last_google_email', payload.email);
        }
      } catch(e) {}
    };

    window.triggerGoogleOAuthFlow = function(clientId, successCallbackName, errorCallbackName) {
      var cid = window.GOOGLE_CLIENT_ID || clientId;
      var redirectUri = window.location.origin + window.location.pathname;

      // If client ID is placeholder, render Google Account Selector overlay
      if (!cid || cid.indexOf('1000000000000') === 0 || cid.indexOf('YOUR_') === 0) {
        showMockGoogleChooser(successCallbackName);
        return;
      }

      openOAuthPopup(cid, redirectUri, successCallbackName, errorCallbackName);
    };

    function showMockGoogleChooser(successCallbackName) {
      var detectedEmail = localStorage.getItem('sn_last_google_email') || 'sertifikasisdppi@gmail.com';
      var name = detectedEmail.split('@')[0];
      name = name.charAt(0).toUpperCase() + name.slice(1);

      var modal = document.createElement('div');
      modal.id = 'sn-google-chooser-modal';
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
      
      var card = document.createElement('div');
      card.style.cssText = 'background:#fff;border-radius:16px;width:360px;max-width:90%;padding:28px 24px;box-shadow:0 12px 32px rgba(0,0,0,0.25);text-align:center;animation:snPopIn 0.2s ease-out;';
      
      card.innerHTML = `
        <style>
          @keyframes snPopIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
          .sn-g-acc:hover { background: #f8f9fa !important; border-color: #1a73e8 !important; }
        </style>
        <svg width="40" height="40" viewBox="0 0 48 48" style="margin-bottom:12px;">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <h3 style="margin:0 0 4px;font-size:18px;font-weight:600;color:#202124;">Pilih Akun Google Anda</h3>
        <p style="margin:0 0 20px;font-size:12px;color:#5f6368;">Lanjutkan ke Satria Nusantara dengan akun Gmail aktif</p>
        
        <div id="sn-g-select-item" class="sn-g-acc" style="display:flex;align-items:center;padding:12px 14px;border:1px solid #dadce0;border-radius:10px;cursor:pointer;margin-bottom:14px;transition:all 0.15s;text-align:left;">
          <div style="width:38px;height:38px;border-radius:50%;background:#1a73e8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;margin-right:12px;flex-shrink:0;">
            ${name.charAt(0).toUpperCase()}
          </div>
          <div style="flex:1;overflow:hidden;">
            <div style="font-size:13px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</div>
            <div style="font-size:11px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${detectedEmail}</div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg>
        </div>

        <div style="display:flex;gap:8px;">
          <button id="sn-g-other-btn" style="flex:1;padding:9px 0;background:#f8f9fa;border:1px solid #dadce0;border-radius:8px;font-size:12px;font-weight:600;color:#3c4043;cursor:pointer;">Ganti Email</button>
          <button id="sn-g-close-btn" style="flex:1;padding:9px 0;background:#fff;border:1px solid #dadce0;border-radius:8px;font-size:12px;color:#70757a;cursor:pointer;">Batal</button>
        </div>
      `;

      modal.appendChild(card);
      document.body.appendChild(modal);

      document.getElementById('sn-g-select-item').onclick = function() {
        if (modal.parentNode) document.body.removeChild(modal);
        var payload = { email: detectedEmail, name: name, sub: 'goog_' + detectedEmail };
        var jsonPayload = JSON.stringify(payload);
        window.dispatchEvent(new CustomEvent('flutter_google_sso_success', { detail: jsonPayload }));
        if (window.flutterGoogleHandler) {
          window.flutterGoogleHandler(detectedEmail, name, 'goog_' + detectedEmail);
        }
        if (window[successCallbackName]) window[successCallbackName](jsonPayload);
      };

      document.getElementById('sn-g-other-btn').onclick = function() {
        var inputEmail = prompt('Masukkan alamat Gmail Anda:', detectedEmail);
        if (inputEmail && inputEmail.indexOf('@') !== -1) {
          if (modal.parentNode) document.body.removeChild(modal);
          var cleanEmail = inputEmail.trim();
          localStorage.setItem('sn_last_google_email', cleanEmail);
          var inputName = cleanEmail.split('@')[0];
          var payload = { email: cleanEmail, name: inputName, sub: 'goog_' + cleanEmail };
          var jsonPayload = JSON.stringify(payload);
          window.dispatchEvent(new CustomEvent('flutter_google_sso_success', { detail: jsonPayload }));
          if (window.flutterGoogleHandler) {
            window.flutterGoogleHandler(cleanEmail, inputName, 'goog_' + cleanEmail);
          }
          if (window[successCallbackName]) window[successCallbackName](jsonPayload);
        }
      };

      document.getElementById('sn-g-close-btn').onclick = function() {
        if (modal.parentNode) document.body.removeChild(modal);
      };
    }

    function openOAuthPopup(cid, redirectUri, successCallbackName, errorCallbackName) {
      var scope = encodeURIComponent('openid email profile');
      var authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
        'client_id=' + encodeURIComponent(cid) +
        '&response_type=token%20id_token' +
        '&scope=' + scope +
        '&redirect_uri=' + encodeURIComponent(redirectUri) +
        '&nonce=' + Math.random().toString(36).substring(2) +
        '&prompt=select_account';

      var width = 500, height = 650;
      var left = (window.screen.width / 2) - (width / 2);
      var top = (window.screen.height / 2) - (height / 2);
      var popup = window.open(authUrl, 'GoogleSSOPopup', 'width=' + width + ',height=' + height + ',top=' + top + ',left=' + left);

      var checkInterval = setInterval(function() {
        if (!popup || popup.closed) {
          clearInterval(checkInterval);
          return;
        }
        try {
          var loc = popup.location.href;
          if (loc && loc.indexOf(redirectUri) === 0 && loc.indexOf('#') !== -1) {
            var hash = loc.substring(loc.indexOf('#') + 1);
            popup.close();
            clearInterval(checkInterval);
            var params = new URLSearchParams(hash);
            var idToken = params.get('id_token');
            var accessToken = params.get('access_token');
            if (idToken) {
              var base64Url = idToken.split('.')[1];
              var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
              var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
              }).join(''));
              var payload = JSON.parse(jsonPayload);
              window.dispatchEvent(new CustomEvent('flutter_google_sso_success', { detail: jsonPayload }));
              if (window[successCallbackName]) window[successCallbackName](JSON.stringify(payload));
            } else if (accessToken) {
              fetch('https://www.googleapis.com/oauth2/v3/userinfo?access_token=' + accessToken)
                .then(function(res) { return res.json(); })
                .then(function(payload) {
                  var payloadStr = JSON.stringify(payload);
                  window.dispatchEvent(new CustomEvent('flutter_google_sso_success', { detail: payloadStr }));
                  if (window[successCallbackName]) window[successCallbackName](payloadStr);
                });
            }
          }
        } catch(e) {
          // Ignore cross-origin error before popup redirects back to redirectUri
        }
      }, 500);
    }
  </script>

  <title>Satria Nusantara Mobile</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
